<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Lock the page: no zoom, fill the whole screen (including round corners / notch area) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Home-screen web app: runs full-screen with no Safari bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Choo Choo">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#d9a066">
<title>Choo Choo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #d9a066;
    /* No scrolling, zooming, selecting or long-press menus */
    position: fixed;
    inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  /* Invisible helper used to read the iPad's safe-area insets from JS */
  #safe {
    position: fixed;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>

<script>
'use strict';

/* =====================================================================
   CONSTANTS & TRACK PIECES
   Edges of a grid cell are numbered clockwise: 0=North 1=East 2=South 3=West.
   Each piece type is a list of connections; a connection joins two edges.
   ===================================================================== */
const COLS = 7, ROWS = 5;
const N = 0, E = 1, S = 2, W = 3;
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];
const EDGE_POINT = [[0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]]; // edge midpoints in a unit cell

const PIECES = {
  straight: [[N, S]],
  curve:    [[S, E]],
  cross:    [[N, S], [E, W]],
  // Points: the "toe" (South) splits into a straight branch (North) and a
  // curved branch (East). piece.set picks which branch is switched on (0 or 1).
  points:   [[S, N], [S, E]],
};
const TRAY = ['straight', 'curve', 'cross', 'points'];
const KNOB = [0.17, 0.83]; // points lever position, in the unrotated unit cell

const SPEED = 1.0;            // train top speed, in cells per second
const ACCEL = 2.0;            // how quickly it speeds up and slows down
const GAP = 0.62;             // distance between carriage centres (cells)
const TRAIN_LEN = GAP * 2 + 0.25;
const CAR_COLOURS = ['#fdd835', '#42a5f5'];

/* =====================================================================
   GAME STATE
   ===================================================================== */
const grid = new Array(COLS * ROWS).fill(null); // piece or null per cell
const order = [];                               // pieces in the order placed (for undo)
let train = null;                               // {c,r,a,b,t,speed,target,chuff,beat}
let drag = null;                                // current finger drag, if any
const particles = [];                           // smoke puffs and dust

/* =====================================================================
   PIECE HELPERS
   ===================================================================== */
function pieceAt(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
  return grid[r * COLS + c];
}

// The piece's connections after applying its rotation (quarter turns clockwise).
function connectionsOf(type, rot) {
  return PIECES[type].map(([a, b]) => [(a + rot) % 4, (b + rot) % 4]);
}

// If a train enters `piece` through edge `entry`, which edge does it leave by? (-1 = none)
function findExit(piece, entry) {
  const conns = connectionsOf(piece.type, piece.rot);
  // Entering points at the toe: go whichever way they're switched
  if (piece.type === 'points' && entry === conns[0][0]) return conns[piece.set][1];
  for (const [a, b] of conns) {
    if (a === entry) return b;
    if (b === entry) return a;
  }
  return -1;
}

// Does the neighbour across edge `e` of cell (c,r) have track pointing back at us?
function neighbourConnects(c, r, e) {
  const nb = pieceAt(c + DX[e], r + DY[e]);
  return !!nb && findExit(nb, (e + 2) % 4) >= 0;
}

// Pick the rotation that joins up best with the track around it. This "smart snap"
// means a toddler can drop a piece roughly in place and it usually just fits.
function bestRotation(type, c, r, preferred) {
  let best = preferred, bestScore = -Infinity;
  for (let k = 0; k < 4; k++) {
    const rot = (preferred + k) % 4;
    const mine = new Set(connectionsOf(type, rot).flat());
    let score = 0;
    for (let e = 0; e < 4; e++) {
      const nc = c + DX[e], nr = r + DY[e];
      const inside = nc >= 0 && nr >= 0 && nc < COLS && nr < ROWS;
      const theirs = neighbourConnects(c, r, e);
      if (mine.has(e) && theirs) score += 2;             // joins up: great
      else if (mine.has(e) && pieceAt(nc, nr)) score -= 1; // points into the side of a piece
      else if (!mine.has(e) && theirs) score -= 1;       // blocks a neighbour's open end
      if (mine.has(e) && !inside) score -= 0.5;          // points off the board
    }
    if (score > bestScore) { bestScore = score; best = rot; }
  }
  return best;
}

function placePiece(type, c, r, preferredRot, smart, set = 0) {
  const old = pieceAt(c, r);
  if (old) removePiece(old);
  const rot = smart ? bestRotation(type, c, r, preferredRot) : preferredRot;
  const p = { type, rot, c, r, spin: 0, pop: 1, set, lever: set };
  grid[r * COLS + c] = p;
  order.push(p);
  sfx.click();
  dust(lay.gx + (c + 0.5) * lay.cell, lay.gy + (r + 0.5) * lay.cell);
  return p;
}

function removePiece(p) {
  grid[p.r * COLS + p.c] = null;
  const i = order.indexOf(p);
  if (i >= 0) order.splice(i, 1);
}

function rotatePiece(p) {
  p.rot = (p.rot + 1) % 4;
  p.spin = -Math.PI / 2; // visual: animate from the old angle to the new one
  sfx.rotate();
}

// Which branch of a points piece ends at `edge`? (-1 if it's the toe or not on the piece)
function branchIndex(p, edge) {
  const conns = connectionsOf(p.type, p.rot);
  return conns[0][1] === edge ? 0 : conns[1][1] === edge ? 1 : -1;
}

// Was the tap at (x,y) on the lever knob of points piece p?
function knobHit(p, x, y) {
  let u = (x - lay.gx) / lay.cell - p.c, v = (y - lay.gy) / lay.cell - p.r;
  for (let k = 0; k < p.rot; k++) [u, v] = [v, 1 - u]; // undo the piece's rotation
  return Math.hypot(u - KNOB[0], v - KNOB[1]) < 0.32;
}

function flipPoints(p) {
  // Never switch under the train (the carriages would jump): just toot instead
  if (trainCells().has(p.c + ',' + p.r)) { sfx.toot(); return; }
  p.set = 1 - p.set;
  sfx.flip();
}

function undo() {
  const p = order[order.length - 1];
  if (!p) { sfx.pop(); return; }
  removePiece(p);
  sfx.pop();
  dust(lay.gx + (p.c + 0.5) * lay.cell, lay.gy + (p.r + 0.5) * lay.cell);
}

/* =====================================================================
   TRACK GEOMETRY
   A path runs across one cell from edge a to edge b. Straights are lines,
   curves are quarter circles (radius ½ cell) round the corner between a and b.
   ===================================================================== */
function isStraight(a, b) { return (a + 2) % 4 === b; }

function curveInfo(a, b) {
  const cx = (a === E || b === E) ? 1 : 0;
  const cy = (a === S || b === S) ? 1 : 0;
  const pa = EDGE_POINT[a], pb = EDGE_POINT[b];
  const a0 = Math.atan2(pa[1] - cy, pa[0] - cx);
  let d = Math.atan2(pb[1] - cy, pb[0] - cx) - a0;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return { cx, cy, a0, d };
}

// Point at fraction t (0..1) along the path from edge a to edge b, in unit-cell coords.
function pathPoint(a, b, t) {
  if (isStraight(a, b)) {
    const pa = EDGE_POINT[a], pb = EDGE_POINT[b];
    return [pa[0] + (pb[0] - pa[0]) * t, pa[1] + (pb[1] - pa[1]) * t];
  }
  const { cx, cy, a0, d } = curveInfo(a, b);
  const ang = a0 + d * t;
  return [cx + 0.5 * Math.cos(ang), cy + 0.5 * Math.sin(ang)];
}

function pathLength(a, b) { return isStraight(a, b) ? 1 : Math.PI / 4; }

/* =====================================================================
   MOVING ALONG THE TRACK
   A track position is {c, r, a, b, t}: in cell (c,r), on the path from edge a
   to edge b, fraction t of the way along. "Forward" means towards b.
   ===================================================================== */
function clonePos(p) { return { c: p.c, r: p.r, a: p.a, b: p.b, t: p.t }; }

// Move `pos` by `dist` cells (negative = backwards), hopping between connected
// pieces. Returns how much distance was left over when the track ran out (0 = fine).
function travel(pos, dist) {
  for (let guard = 0; guard < 100 && dist !== 0; guard++) {
    const len = pathLength(pos.a, pos.b);
    if (dist > 0) {
      const room = (1 - pos.t) * len;
      if (dist <= room) { pos.t += dist / len; return 0; }
      dist -= room; pos.t = 1;
      const nc = pos.c + DX[pos.b], nr = pos.r + DY[pos.b], entry = (pos.b + 2) % 4;
      const np = pieceAt(nc, nr);
      const exit = np ? findExit(np, entry) : -1;
      if (exit < 0) return dist;                       // open end ahead
      pos.c = nc; pos.r = nr; pos.a = entry; pos.b = exit; pos.t = 0;
    } else {
      const room = pos.t * len;
      if (-dist <= room) { pos.t += dist / len; return 0; }
      dist += room; pos.t = 0;
      const nc = pos.c + DX[pos.a], nr = pos.r + DY[pos.a], entry = (pos.a + 2) % 4;
      const np = pieceAt(nc, nr);
      const other = np ? findExit(np, entry) : -1;
      if (other < 0) return -dist;                     // open end behind
      pos.c = nc; pos.r = nr; pos.a = other; pos.b = entry; pos.t = 1;
    }
  }
  return Math.abs(dist);
}

function worldPoint(pos) {
  const p = pathPoint(pos.a, pos.b, pos.t);
  return [lay.gx + (pos.c + p[0]) * lay.cell, lay.gy + (pos.r + p[1]) * lay.cell];
}

/* =====================================================================
   THE TRAIN
   ===================================================================== */
// Put the train on the track, ready to set off in direction `dir` (1 or -1).
function startTrain(dir) {
  // Prefer starting at an open end, with the train pointing away from the end
  // it's about to drive away from. On a closed loop start on the first piece placed.
  let start = null;
  search:
  for (const p of order) {
    for (const [x, y] of connectionsOf(p.type, p.rot)) {
      for (const [from, to] of [[x, y], [y, x]]) {
        if (!neighbourConnects(p.c, p.r, from)) {
          if (dir > 0) {
            // Engine leads away from the end; carriages trail back to the end
            start = { c: p.c, r: p.r, a: from, b: to, t: 0 };
            travel(start, TRAIN_LEN);
          } else {
            // Engine sits at the end facing it; it will push the carriages away
            start = { c: p.c, r: p.r, a: to, b: from, t: 0.95 };
          }
          break search;
        }
      }
    }
  }
  if (!start) {
    const p = order[0];
    const [a, b] = connectionsOf(p.type, p.rot)[0];
    start = { c: p.c, r: p.r, a, b, t: 0.5 };
  }
  train = Object.assign(start, { speed: 0, target: 0, chuff: 0, beat: 0 });
}

// The drive buttons: 1 = forward, 0 = stop, -1 = backwards.
function drive(target) {
  if (!train) {
    if (target === 0 || !order.length) { sfx.toot(); return; }
    startTrain(target);
  }
  if (target === train.target) return;
  if (target === 0) sfx.hiss();
  else if (train.target === 0) sfx.toot();
  train.target = target;
}

// Reached the end of the track: bump to a stop and wait for the other button.
function bump() {
  train.speed = 0;
  train.target = 0;
  train.jolt = 1;
  sfx.bump();
  sfx.toot(0.25);
}

function removeTrain() {
  if (!train) return;
  const [x, y] = worldPoint(train);
  for (let i = 0; i < 6; i++) puff(x, y, 1.6);
  train = null;
}

// The grid squares the train is currently covering, as "c,r" strings.
function trainCells() {
  const cells = new Set();
  if (!train) return cells;
  for (let d = -0.3; d <= TRAIN_LEN + 0.05; d += 0.1) {
    const p = clonePos(train);
    travel(p, -d);
    cells.add(p.c + ',' + p.r);
  }
  return cells;
}

// How far short of the rear of the train does the track run out? (0 = room for all)
function rearShortfall(pos) { return travel(clonePos(pos), -TRAIN_LEN); }

// If someone changed the piece under the engine, re-seat the train sensibly.
function checkTrain() {
  const p = pieceAt(train.c, train.r);
  if (!p) { removeTrain(); return false; }
  if (findExit(p, train.a) === train.b) return true;
  let ex = findExit(p, train.a);
  if (ex >= 0) { train.b = ex; return true; }
  ex = findExit(p, train.b);
  if (ex >= 0) { train.a = ex; return true; }
  [train.a, train.b] = connectionsOf(p.type, p.rot)[0];
  return true;
}

function updateTrain(dt) {
  if (!train || !checkTrain()) return;
  // Running through points from a branch pushes them over to that branch
  // (like real sprung points), so the carriages behind follow the engine.
  const ep = pieceAt(train.c, train.r);
  if (ep.type === 'points') {
    let br = branchIndex(ep, train.a);
    if (br < 0) br = branchIndex(ep, train.b);
    if (br >= 0 && br !== ep.set) { ep.set = br; sfx.flip(); }
  }
  train.jolt = Math.max(0, (train.jolt || 0) - dt * 3);

  // Ease the speed towards what the buttons ask for
  const want = train.target * SPEED;
  const dv = ACCEL * dt;
  train.speed += Math.max(-dv, Math.min(dv, want - train.speed));
  if (Math.abs(train.speed) < 0.001) return;

  const step = train.speed * dt;
  if (step > 0) {
    // Engine first: bump to a stop when the engine reaches an open end
    if (travel(train, step) > 0) bump();
  } else {
    // Backing up: bump to a stop when the last carriage reaches an open end
    const before = rearShortfall(train);
    const probe = clonePos(train);
    const left = travel(probe, step);
    if (left > 0 || (before === 0 && rearShortfall(probe) > 0)) bump();
    else Object.assign(train, probe);
  }

  // Choo-choo: a chuff sound and a smoke puff on every beat (slower when slow)
  train.chuff -= dt * Math.abs(train.speed) / SPEED;
  if (train.chuff <= 0) {
    train.chuff = 0.3 / SPEED;
    train.beat++;
    sfx.chuff(train.beat % 2 === 0);
    const e = carPose(train);
    puff(e.x + Math.cos(e.a) * lay.cell * 0.1, e.y + Math.sin(e.a) * lay.cell * 0.1, 1);
  }
}

// Screen position and heading of a car whose centre is at track position `pos`.
// Uses a front and back "bogie" so cars bend nicely round curves.
function carPose(pos) {
  const f = clonePos(pos); travel(f, 0.17);
  const b = clonePos(pos); travel(b, -0.17);
  const pf = worldPoint(f), pb = worldPoint(b);
  return { x: (pf[0] + pb[0]) / 2, y: (pf[1] + pb[1]) / 2,
           a: Math.atan2(pf[1] - pb[1], pf[0] - pb[0]) };
}

/* =====================================================================
   PARTICLES (smoke puffs and placement dust)
   ===================================================================== */
function puff(x, y, size) {
  const s = lay.cell;
  particles.push({
    x, y, vx: (Math.random() - 0.5) * s * 0.25, vy: -s * (0.25 + Math.random() * 0.15),
    life: 1.3, max: 1.3, r0: s * 0.07 * size, r1: s * 0.3 * size, colour: '255,255,255',
  });
}

function dust(x, y) {
  const s = lay.cell;
  for (let i = 0; i < 7; i++) {
    const ang = (i / 7) * Math.PI * 2 + Math.random() * 0.5;
    particles.push({
      x, y, vx: Math.cos(ang) * s * 1.2, vy: Math.sin(ang) * s * 1.2,
      life: 0.45, max: 0.45, r0: s * 0.07, r1: s * 0.02, colour: '255,236,179',
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.97; p.vy *= 0.97;
  }
}

/* =====================================================================
   SOUND (Web Audio, all synthesised - no files)
   iOS only allows audio after a touch, so the AudioContext is created on
   the first touch and resumed on later touches if iOS suspended it.
   ===================================================================== */
let ac = null, master = null, noiseBuf = null;

function unlockAudio() {
  try {
    if (!ac) {
      // Let sound play even when the iPad's silent switch is on (iOS 17+)
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.8;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') ac.resume();
  } catch (err) { /* no sound is fine */ }
}

function envelope(g, t, vol, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}

function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  envelope(g, t, vol, 0.008, dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function noise(dur, freq, q, vol, delay = 0) {
  const t = ac.currentTime + delay;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  envelope(g, t, vol, 0.006, dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

const sfx = {
  ok() { return ac && ac.state === 'running'; },
  // wooden "clack" as a piece snaps into place
  click()  { if (!this.ok()) return; noise(0.06, 2400, 4, 0.6); tone('triangle', 300, 140, 0.09, 0.4); },
  rotate() { if (!this.ok()) return; noise(0.05, 3200, 5, 0.4); tone('triangle', 520, 380, 0.06, 0.25); },
  pick()   { if (!this.ok()) return; tone('sine', 480, 820, 0.09, 0.2); },
  pop()    { if (!this.ok()) return; tone('sine', 700, 110, 0.2, 0.35); },
  // points lever: a chunky clunk-clunk
  flip()   {
    if (!this.ok()) return;
    noise(0.06, 1400, 3, 0.55); tone('triangle', 240, 150, 0.1, 0.4);
    noise(0.05, 1900, 4, 0.4, 0.07);
  },
  // steam chuff: a short burst of filtered noise
  chuff(strong) { if (!this.ok()) return; noise(0.15, strong ? 700 : 900, 0.9, strong ? 0.5 : 0.28); },
  // two-note whistle: whoo-whoo!
  // stopping: a soft hiss of steam
  hiss() { if (!this.ok()) return; noise(0.7, 4000, 0.7, 0.25); },
  // hitting the buffers at the end of the track
  bump() { if (!this.ok()) return; tone('sine', 140, 55, 0.25, 0.6); noise(0.08, 500, 1.5, 0.5); },
  toot(delay = 0) {
    if (!this.ok()) return;
    for (const [start, dur] of [[0, 0.22], [0.3, 0.45]]) {
      for (const f of [587, 740]) {
        const t = ac.currentTime + delay + start;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f * 0.97, t);
        o.frequency.linearRampToValueAtTime(f, t + 0.06);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.16, t + 0.04);
        g.gain.setValueAtTime(0.16, t + dur - 0.06);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.05);
      }
    }
  },
};

/* =====================================================================
   LAYOUT
   Landscape: tray of pieces on the left, buttons on the right.
   Portrait:  buttons along the top, tray along the bottom.
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');   // static scenery, redrawn only on resize
const bgCtx = bg.getContext('2d');
let scrW = 0, scrH = 0, dpr = 1;
const lay = {};

function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  scrW = window.innerWidth; scrH = window.innerHeight;
  canvas.width = bg.width = Math.round(scrW * dpr);
  canvas.height = bg.height = Math.round(scrH * dpr);

  const cs = getComputedStyle(document.getElementById('safe'));
  const st = parseFloat(cs.paddingTop) || 0, sr = parseFloat(cs.paddingRight) || 0;
  const sb = parseFloat(cs.paddingBottom) || 0, sl = parseFloat(cs.paddingLeft) || 0;
  const ax = sl, ay = st, aw = scrW - sl - sr, ah = scrH - st - sb;

  const landscape = aw >= ah;
  const panel = Math.max(100, Math.min(170, Math.min(aw, ah) * 0.19));
  let tray, btns, area;
  if (landscape) {
    tray = { x: ax, y: ay, w: panel, h: ah };
    btns = { x: ax + aw - panel, y: ay, w: panel, h: ah };
    area = { x: ax + panel, y: ay, w: aw - 2 * panel, h: ah };
  } else {
    btns = { x: ax, y: ay, w: aw, h: panel };
    tray = { x: ax, y: ay + ah - panel, w: aw, h: panel };
    area = { x: ax, y: ay + panel, w: aw, h: ah - 2 * panel };
  }

  const pad = 14;
  lay.cell = Math.floor(Math.min((area.w - 2 * pad) / COLS, (area.h - 2 * pad) / ROWS));
  lay.gx = Math.round(area.x + (area.w - lay.cell * COLS) / 2);
  lay.gy = Math.round(area.y + (area.h - lay.cell * ROWS) / 2);
  lay.landscape = landscape;
  lay.tray = tray;
  lay.btns = btns;

  // Tray slots spread evenly along the tray
  const len = landscape ? tray.h : tray.w;
  const slot = Math.min(panel * 0.8, (len / TRAY.length) * 0.8);
  lay.slots = TRAY.map((type, i) => {
    const f = (i + 0.5) / TRAY.length;
    return {
      type, s: slot,
      x: landscape ? tray.x + tray.w / 2 : tray.x + tray.w * f,
      y: landscape ? tray.y + tray.h * f : tray.y + tray.h / 2,
    };
  });

  // Drive buttons (forward, stop, backwards) and the bin.
  // Landscape: stacked down the right. Portrait: in a row along the top.
  lay.fwd  = { r: panel * 0.36, press: 0 };
  lay.stop = { r: panel * 0.36, press: 0 };
  lay.back = { r: panel * 0.36, press: 0 };
  lay.bin  = { r: panel * 0.28, press: 0 };
  const place = [[lay.fwd, 0.15], [lay.stop, 0.37], [lay.back, 0.59], [lay.bin, 0.85]];
  for (const [b, f] of place) {
    if (landscape) Object.assign(b, { x: btns.x + btns.w / 2, y: btns.y + btns.h * f });
    else           Object.assign(b, { x: btns.x + btns.w * (1 - f), y: btns.y + btns.h / 2 });
  }

  drawScenery();
}

/* =====================================================================
   DRAWING HELPERS
   ===================================================================== */
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }

function tracePath(g, a, b) {
  g.beginPath();
  if (isStraight(a, b)) {
    g.moveTo(...EDGE_POINT[a]);
    g.lineTo(...EDGE_POINT[b]);
  } else {
    const { cx, cy, a0, d } = curveInfo(a, b);
    g.arc(cx, cy, 0.5, a0, a0 + d, d < 0);
  }
}

// Wooden track is drawn as stacked strokes: outline, wood, groove, wood.
// The groove stroke peeking out either side of the inner wood gives the two rails.
const TRACK_LAYERS = [
  { w: 0.54, c: '#7a4a1f' },
  { w: 0.48, c: '#f0bf78' },
  { w: 0.30, c: '#b67b3c' },
  { w: 0.21, c: '#f3c887' },
];

function strokePaths(g, conns, layers) {
  for (const layer of layers) {
    g.strokeStyle = layer.c;
    g.lineWidth = layer.w;
    for (const [a, b] of conns) { tracePath(g, a, b); g.stroke(); }
  }
}

// Draw a track piece centred at (x,y), `size` pixels across. The piece is drawn
// in its unrotated shape and the canvas is turned, so the lever turns with it.
// For points, `set` is the switched branch and `lever` animates between 0 and 1.
function drawPiece(g, type, rot, x, y, size, spin = 0, scale = 1, alpha = 1, set = 0, lever = 0) {
  const conns = PIECES[type];
  const s = size * scale;
  const frame = (dx, dy) => {
    g.translate(x + dx, y + dy);
    g.rotate(spin + rot * Math.PI / 2);
    g.scale(s, s);
    g.translate(-0.5, -0.5);
  };
  g.save();
  g.globalAlpha = alpha;
  g.lineCap = 'butt';

  // soft shadow, always falling down and to the right on screen
  g.save();
  frame(s * 0.025, s * 0.035);
  strokePaths(g, conns, [{ w: 0.54, c: 'rgba(0,0,0,0.22)' }]);
  g.restore();

  g.save();
  frame(0, 0);
  if (type === 'points') {
    // Draw the switched-on branch last so its rails run unbroken through the split
    const on = conns[set], off = conns[1 - set];
    strokePaths(g, conns, TRACK_LAYERS.slice(0, 2));
    strokePaths(g, [off], TRACK_LAYERS.slice(2));
    strokePaths(g, [on], TRACK_LAYERS.slice(2));
    drawPointsArrow(g, on);
    drawLever(g, lever);
  } else {
    strokePaths(g, conns, TRACK_LAYERS);
  }
  g.restore();
  g.restore();
}

// A little white arrow on the branch the train will take
function drawPointsArrow(g, [a, b]) {
  const [x0, y0] = pathPoint(a, b, 0.5), [x1, y1] = pathPoint(a, b, 0.62);
  g.save();
  g.translate(x1, y1);
  g.rotate(Math.atan2(y1 - y0, x1 - x0));
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.beginPath();
  g.moveTo(0.07, 0); g.lineTo(-0.05, -0.065); g.lineTo(-0.05, 0.065);
  g.closePath();
  g.fill();
  g.restore();
}

// Points lever: a red ball on a stick that leans towards the switched-on branch
function drawLever(g, lever) {
  const [kx, ky] = KNOB;
  const ang = (-100 + 90 * lever) * Math.PI / 180;  // straight: up, curve: right
  const bx = kx + Math.cos(ang) * 0.15, by = ky + Math.sin(ang) * 0.15;
  g.fillStyle = 'rgba(0,0,0,0.25)'; circle(g, kx + 0.015, ky + 0.02, 0.11); g.fill();
  g.fillStyle = '#6d4c41';          circle(g, kx, ky, 0.1); g.fill();
  g.strokeStyle = '#3e2723';
  g.lineWidth = 0.045;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(kx, ky); g.lineTo(bx, by); g.stroke();
  g.fillStyle = '#e53935';          circle(g, bx, by, 0.105); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.6)'; circle(g, bx - 0.03, by - 0.03, 0.035); g.fill();
}

// Top-down engine, drawn in "cell units" facing +x.
function drawEngine(g) {
  g.fillStyle = 'rgba(0,0,0,0.25)'; rr(g, -0.25, -0.13, 0.54, 0.32, 0.08); g.fill();
  g.fillStyle = '#37474f';           rr(g, -0.28, -0.16, 0.56, 0.32, 0.07); g.fill();
  g.fillStyle = '#e53935';           rr(g, -0.1, -0.13, 0.37, 0.26, 0.13); g.fill();
  g.fillStyle = '#ef9a9a';           rr(g, -0.08, -0.1, 0.32, 0.06, 0.03); g.fill(); // shine
  g.fillStyle = '#1e88e5';           rr(g, -0.28, -0.155, 0.21, 0.31, 0.05); g.fill(); // cab
  g.fillStyle = '#90caf9';           rr(g, -0.25, -0.12, 0.15, 0.24, 0.04); g.fill(); // roof
  g.fillStyle = '#fdd835';           g.fillRect(-0.02, -0.13, 0.03, 0.26);             // band
  g.fillStyle = '#212121';           circle(g, 0.12, 0, 0.055); g.fill();              // chimney
  g.fillStyle = '#555';              circle(g, 0.12, 0, 0.03); g.fill();
  // friendly eyes looking where it's going
  for (const ey of [-0.065, 0.065]) {
    g.fillStyle = '#fff';    circle(g, 0.225, ey, 0.04); g.fill();
    g.fillStyle = '#212121'; circle(g, 0.24, ey, 0.02); g.fill();
  }
}

function drawCarriage(g, colour) {
  g.fillStyle = 'rgba(0,0,0,0.25)'; rr(g, -0.21, -0.12, 0.46, 0.3, 0.07); g.fill();
  g.fillStyle = '#5d4037';           rr(g, -0.24, -0.15, 0.48, 0.3, 0.06); g.fill();
  g.fillStyle = colour;              rr(g, -0.21, -0.12, 0.42, 0.24, 0.05); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.45)'; rr(g, -0.17, -0.09, 0.34, 0.05, 0.025); g.fill();
}

// Side-view train icon for the Go button (drawn in units of the button radius).
function drawTrainIcon(g, x, y, r, bgColour) {
  g.save();
  g.translate(x, y);
  g.scale(r, r);
  g.fillStyle = '#fff';
  rr(g, -0.58, -0.12, 0.7, 0.38, 0.08); g.fill();   // boiler
  rr(g, 0.06, -0.45, 0.46, 0.71, 0.06); g.fill();   // cab
  rr(g, 0.0, -0.53, 0.58, 0.12, 0.05); g.fill();    // roof
  g.fillRect(-0.48, -0.38, 0.16, 0.3);              // chimney
  rr(g, -0.54, -0.44, 0.24, 0.09, 0.04); g.fill();  // chimney top
  g.fillStyle = bgColour;
  rr(g, 0.16, -0.34, 0.26, 0.2, 0.04); g.fill();    // cab window
  for (const [wx, wr] of [[-0.38, 0.13], [-0.06, 0.13], [0.32, 0.17]]) {
    g.fillStyle = '#fff';   circle(g, wx, 0.38, wr); g.fill();
    g.fillStyle = bgColour; circle(g, wx, 0.38, wr * 0.35); g.fill();
  }
  g.restore();
}

// Forward / backwards icon: a little engine facing right with an arrow out of
// its front (dir 1) or out of its back (dir -1). Drawn at the button's centre.
function drawDriveIcon(g, r, dir, bgColour) {
  g.save();
  g.translate(-dir * r * 0.2, 0);
  g.scale(-1, 1); // the train icon faces left; flip it to face right
  drawTrainIcon(g, 0, 0, r * 0.45, bgColour);
  g.restore();
  const tipX = dir * r * 0.72, baseX = dir * r * 0.36;
  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(tipX, 0);
  g.lineTo(baseX, -r * 0.26);
  g.lineTo(baseX, r * 0.26);
  g.closePath();
  g.fill();
}

function drawBinIcon(g, x, y, r) {
  g.save();
  g.translate(x, y);
  g.scale(r, r);
  g.fillStyle = '#fff';
  g.beginPath();                                    // can
  g.moveTo(-0.38, -0.25); g.lineTo(0.38, -0.25);
  g.lineTo(0.3, 0.5); g.lineTo(-0.3, 0.5); g.closePath(); g.fill();
  rr(g, -0.48, -0.42, 0.96, 0.13, 0.05); g.fill();  // lid
  rr(g, -0.14, -0.53, 0.28, 0.13, 0.05); g.fill();  // handle
  g.fillStyle = '#78909c';
  for (const sx of [-0.15, 0, 0.15]) { rr(g, sx - 0.035, -0.15, 0.07, 0.55, 0.035); g.fill(); }
  g.restore();
}

/* =====================================================================
   SCENERY (static: wooden table, green play mat, tray). Cached in `bg`.
   ===================================================================== */
function drawScenery() {
  const g = bgCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Wooden table: planks with a little grain
  g.fillStyle = '#d9a066';
  g.fillRect(0, 0, scrW, scrH);
  const plank = 70;
  for (let y = 0; y < scrH; y += plank) {
    g.fillStyle = (y / plank) % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.03)';
    g.fillRect(0, y, scrW, plank);
    g.fillStyle = 'rgba(120,70,30,0.35)';
    g.fillRect(0, y, scrW, 2);
    g.strokeStyle = 'rgba(150,90,40,0.15)';
    g.lineWidth = 1.5;
    for (let k = 1; k < 4; k++) {
      g.beginPath();
      const gy = y + k * plank / 4;
      g.moveTo(0, gy);
      for (let x = 0; x <= scrW; x += 40) g.lineTo(x, gy + Math.sin(x * 0.01 + y + k) * 3);
      g.stroke();
    }
  }

  // Panels (tray and buttons)
  for (const p of [lay.tray, lay.btns]) {
    const m = 10;
    g.fillStyle = 'rgba(0,0,0,0.2)';
    rr(g, p.x + m + 3, p.y + m + 5, p.w - 2 * m, p.h - 2 * m, 22); g.fill();
    g.fillStyle = '#b8743a';
    rr(g, p.x + m, p.y + m, p.w - 2 * m, p.h - 2 * m, 22); g.fill();
    g.fillStyle = '#c98648';
    rr(g, p.x + m + 6, p.y + m + 6, p.w - 2 * m - 12, p.h - 2 * m - 12, 17); g.fill();
  }

  // Tray slots with their pieces
  for (const s of lay.slots) {
    g.fillStyle = '#9c5f2b';
    rr(g, s.x - s.s / 2, s.y - s.s / 2 + 3, s.s, s.s, 18); g.fill();
    g.fillStyle = '#fbe9cf';
    rr(g, s.x - s.s / 2, s.y - s.s / 2, s.s, s.s, 18); g.fill();
    drawPiece(g, s.type, 0, s.x, s.y, s.s * 0.82);
  }

  // Green play mat with a soft checkerboard so the squares are easy to see
  const { gx, gy, cell } = lay;
  const mw = cell * COLS, mh = cell * ROWS, m = 10;
  g.fillStyle = 'rgba(0,0,0,0.2)';
  rr(g, gx - m + 3, gy - m + 6, mw + 2 * m, mh + 2 * m, 20); g.fill();
  g.fillStyle = '#4e9a35';
  rr(g, gx - m, gy - m, mw + 2 * m, mh + 2 * m, 20); g.fill();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      g.fillStyle = (r + c) % 2 ? '#7fcb5c' : '#8ad466';
      g.fillRect(gx + c * cell, gy + r * cell, cell, cell);
    }
  }
}

/* =====================================================================
   MAIN DRAW
   ===================================================================== */
function drawButton(b, colour, icon) {
  const s = 1 - 0.12 * b.press;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; circle(ctx, 3, 6, b.r); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; circle(ctx, 0, 0, b.r); ctx.fill();
  ctx.fillStyle = colour;             circle(ctx, 0, 0, b.r * 0.93); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; circle(ctx, -b.r * 0.2, -b.r * 0.25, b.r * 0.55); ctx.fill();
  icon();
  ctx.restore();
}

function draw(time) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { gx, gy, cell } = lay;

  // Highlight the square a dragged piece would land on
  if (drag && drag.moved) {
    const t = cellAt(drag.x, drag.y, true);
    if (t) {
      ctx.fillStyle = 'rgba(255,241,118,0.6)';
      rr(ctx, gx + t.c * cell + 3, gy + t.r * cell + 3, cell - 6, cell - 6, 12); ctx.fill();
    }
  }

  // Placed pieces (with rotate and "pop" animations)
  for (const p of order) {
    const bounce = 1 + 0.15 * Math.sin(Math.PI * p.pop);
    drawPiece(ctx, p.type, p.rot, gx + (p.c + 0.5) * cell, gy + (p.r + 0.5) * cell, cell,
              p.spin, bounce, 1, p.set, p.lever);
  }

  // Train: carriages trail behind the engine along the track
  if (train) {
    const poses = [0, 1, 2].map(i => {
      const pos = clonePos(train);
      travel(pos, -GAP * i);
      return carPose(pos);
    });
    // A little shudder after bumping into the buffers
    const jolt = train.jolt || 0;
    const jx = Math.sin(jolt * 25) * jolt * cell * 0.05;
    ctx.save();
    ctx.translate(Math.cos(poses[0].a) * jx, Math.sin(poses[0].a) * jx);
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = cell * 0.05;
    ctx.beginPath();
    ctx.moveTo(poses[0].x, poses[0].y);
    for (const p of poses) ctx.lineTo(p.x, p.y);
    ctx.stroke();
    for (let i = poses.length - 1; i >= 0; i--) {
      const p = poses[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.scale(cell, cell);
      if (i === 0) drawEngine(ctx); else drawCarriage(ctx, CAR_COLOURS[i - 1]);
      ctx.restore();
    }
    ctx.restore();
  }

  // Smoke and dust
  for (const p of particles) {
    const k = 1 - p.life / p.max;
    ctx.fillStyle = `rgba(${p.colour},${(p.life / p.max) * 0.85})`;
    circle(ctx, p.x, p.y, p.r0 + (p.r1 - p.r0) * k);
    ctx.fill();
  }

  // Drive buttons. The one the train is obeying has a pulsing ring.
  const target = train ? train.target : 0;
  const active = target > 0 ? lay.fwd : target < 0 ? lay.back : null;
  if (active) {
    const pulse = (time / 1000) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - pulse)})`;
    ctx.lineWidth = 6;
    circle(ctx, active.x, active.y, active.r * (1 + 0.3 * pulse));
    ctx.stroke();
  }
  drawButton(lay.fwd, '#43a047', () => drawDriveIcon(ctx, lay.fwd.r, 1, '#43a047'));
  drawButton(lay.stop, '#e53935', () => {
    ctx.fillStyle = '#fff';
    const s = lay.stop.r * 0.62;
    rr(ctx, -s / 2, -s / 2, s, s, s * 0.15);
    ctx.fill();
  });
  drawButton(lay.back, '#fbc02d', () => drawDriveIcon(ctx, lay.back.r, -1, '#fbc02d'));
  // The bin grows a little when you drag a placed piece, inviting you to drop it there
  const binBig = drag && drag.piece && drag.moved;
  const binR = lay.bin.r;
  if (binBig) lay.bin.r = binR * (1.15 + 0.05 * Math.sin(time / 120));
  drawButton(lay.bin, '#78909c', () => drawBinIcon(ctx, 0, 0, lay.bin.r * 0.62));
  lay.bin.r = binR;

  // The piece under the finger
  if (drag && drag.moved) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 8;
    drawPiece(ctx, drag.type, drag.rot, drag.x, drag.y, cell * 1.05, 0, 1, 0.9, drag.set, drag.set);
    ctx.restore();
  }
}

/* =====================================================================
   TOUCH INPUT (pointer events: one finger at a time)
   ===================================================================== */
function hitCircle(b, x, y, slack = 1.15) { return Math.hypot(x - b.x, y - b.y) < b.r * slack; }

// Which grid square is at (x,y)? `forgiving` snaps drops just outside the mat inwards.
function cellAt(x, y, forgiving) {
  const { gx, gy, cell } = lay;
  let c = Math.floor((x - gx) / cell), r = Math.floor((y - gy) / cell);
  if (forgiving) {
    const m = cell * 0.5;
    if (x < gx - m || y < gy - m || x > gx + cell * COLS + m || y > gy + cell * ROWS + m) return null;
    c = Math.max(0, Math.min(COLS - 1, c));
    r = Math.max(0, Math.min(ROWS - 1, r));
  }
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
  return { c, r };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  if (drag) return; // ignore extra fingers
  const x = e.clientX, y = e.clientY;

  for (const [b, target] of [[lay.fwd, 1], [lay.stop, 0], [lay.back, -1]]) {
    if (hitCircle(b, x, y, 1.1)) { b.press = 1; drive(target); return; }
  }
  if (hitCircle(lay.bin, x, y)) { lay.bin.press = 1; undo(); return; }

  // Pick up a new piece from the tray
  for (const s of lay.slots) {
    if (Math.abs(x - s.x) < s.s * 0.6 && Math.abs(y - s.y) < s.s * 0.6) {
      drag = { id: e.pointerId, type: s.type, rot: 0, set: 0, piece: null, x, y, sx: x, sy: y, moved: true };
      canvas.setPointerCapture(e.pointerId);
      sfx.pick();
      return;
    }
  }

  // Touch a placed piece: tap to rotate (or flip a points lever), or drag to move/remove
  const t = cellAt(x, y, false);
  const p = t && pieceAt(t.c, t.r);
  if (p) {
    if (train && train.c === p.c && train.r === p.r) { sfx.toot(); return; } // tapping the engine toots
    drag = { id: e.pointerId, type: p.type, rot: p.rot, set: p.set, piece: p, x, y, sx: x, sy: y, moved: false };
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.moved && Math.hypot(drag.x - drag.sx, drag.y - drag.sy) > lay.cell * 0.2) {
    drag.moved = true;
    removePiece(drag.piece); // lift it off the board
    sfx.pick();
  }
});

canvas.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  unlockAudio();
  if (d.piece && !d.moved) {
    if (d.piece.type === 'points' && knobHit(d.piece, d.sx, d.sy)) flipPoints(d.piece);
    else rotatePiece(d.piece);
    return;
  }
  if (d.piece && hitCircle(lay.bin, d.x, d.y, 1.6)) { sfx.pop(); dust(d.x, d.y); return; }
  const t = cellAt(d.x, d.y, true);
  if (t) placePiece(d.type, t.c, t.r, d.rot, true, d.set);
  else if (d.piece) { sfx.pop(); dust(d.x, d.y); } // dragged off the board: gone
});

canvas.addEventListener('pointercancel', e => {
  if (!drag || e.pointerId !== drag.id) return;
  // iOS interrupted the touch: put a lifted piece back where it was
  if (drag.piece && drag.moved && !pieceAt(drag.piece.c, drag.piece.r)) {
    grid[drag.piece.r * COLS + drag.piece.c] = drag.piece;
    order.push(drag.piece);
  }
  drag = null;
});

// Belt and braces against Safari zooming, scrolling, magnifier and menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart']) {
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
}
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', unlockAudio, { passive: true }); // iOS likes touchend for audio
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ac) ac.suspend();
});

/* =====================================================================
   HOME-SCREEN ICON (drawn at start-up: a little loop of track with the engine)
   ===================================================================== */
function makeIcon() {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#8ad466';
  g.fillRect(0, 0, 180, 180);
  const s = 70, o = 20;
  drawPiece(g, 'curve', 0, o + s * 0.5, o + s * 0.5, s);
  drawPiece(g, 'curve', 1, o + s * 1.5, o + s * 0.5, s);
  drawPiece(g, 'curve', 2, o + s * 1.5, o + s * 1.5, s);
  drawPiece(g, 'curve', 3, o + s * 0.5, o + s * 1.5, s);
  g.save();
  g.translate(90, o + s * 0.5);
  g.scale(s * 1.3, s * 1.3);
  drawEngine(g);
  g.restore();
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;

  for (const p of order) {
    p.spin *= Math.max(0, 1 - dt * 14);
    p.pop = Math.max(0, p.pop - dt * 4);
    p.lever += (p.set - p.lever) * Math.min(1, dt * 12);
  }
  for (const b of [lay.fwd, lay.stop, lay.back, lay.bin]) b.press = Math.max(0, b.press - dt * 6);
  updateTrain(dt);
  updateParticles(dt);
  draw(now);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();
makeIcon();
requestAnimationFrame(frame);
</script>
</body>
